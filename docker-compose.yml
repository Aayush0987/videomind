# Declarative topology for local development (§21.1). Backend and frontend
# each ship a Dockerfile; `docker compose up` needs only a populated .env
# (copy .env.example first).
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
