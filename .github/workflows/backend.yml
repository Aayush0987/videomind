name: backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: pip install -e "backend[dev]"

      - name: Ruff check
        run: ruff check backend

      - name: Ruff format check
        run: ruff format --check backend

      - name: Mypy
        run: mypy backend/app/core backend/app/agents backend/app/graphs

      - name: Pytest
        run: pytest backend/tests -q --maxfail=1
