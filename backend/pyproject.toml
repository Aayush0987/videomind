[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videomind-backend"
version = "0.1.0"
description = "VideoMind backend: agentic video intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.140.13",
    "uvicorn==0.51.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "langgraph==1.2.9",
    "litellm==1.93.0",
    "chromadb==1.5.9",
    "yt-dlp==2026.7.4",
    "faster-whisper==1.2.1",
    "youtube-transcript-api==1.2.4",
    "mlflow==3.14.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers==5.6.1",
    "torch==2.13.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.163.0",
    "respx==0.23.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
